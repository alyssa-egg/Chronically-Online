[build]
  command = "npm --prefix studio ci --no-fund --no-audit && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  included_files = ["content/issues/*.json"]

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/stories/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/archive/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/eras/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/play/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/memories/"
  to = "/index.html"
  status = 200
